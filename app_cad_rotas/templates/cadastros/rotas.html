{% load static %}

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap 5 CSS & Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <title>ROTAS</title>
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #02447e;
        min-height: 100vh;
      }

      table {
        border: none;
      }

      th,
      td {
        padding: 12px 8px; /* Espaçamento interno */
        text-align: left;
        border-bottom: 1px solid #ccc; /* Cria Apenas a linha horizontal */
      }
    </style>
  </head>
  <body>
    <div
      class="container"
      style="display: flex; flex-direction: column; align-items: center"
    >
      <div class="row w-100">
        <div class="col-lg-12 text-center border-end-lg border-secondary pe-lg-4">
          <img
            src="{% static 'logo-white.jpg' %}"
            alt="Henrimar System"
            class="img-fluid my-3"
            style="max-height: 180px"
          />
          <div class="row comandos-pesquisa" style="display: flex; justify-content: space-around;">
                <div class="col-lg-6 search ">
                    <input style=" border-radius: 8px; border: none;" type="text" placeholder="Pesquisar..." >
                    <button>Pesquisar...</button>
                </div>
                <div class="col-lg-6 btns-navbar">
                    
                    <button>Exit</button>
                </div>
          </div>
         
       
        </div>
      </div>
      <br>
      <div class="row w-100">
        <table class="bg-white" style="border-radius: 10px">
          <tr>
            <th>id</th>
            <th>ROTAS</th>
            <th>MOTORISTA</th>
            <th>Valor</th>
            <th>Atividade</th>
            <th></th>
          </tr>
          {% for rota in rotas %}
          <tr>
            <td>{{rota.id_rotas}}</td>
            <td>{{rota.rota}}</td>
            <td>{{rota.motorista}}</td>
            <td>200</td>
            <td>Andamento</td>
            <td>X</td>
          </tr>
          {% endfor %}
        </table>
      </div>
    </div>
  </body>
</html>
