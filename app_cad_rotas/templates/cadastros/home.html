{% load static %}

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5 CSS & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <title>Cadastro de Rotas - HenriMar System</title>

    <style>
      :root {
        --brand-primary: #2563eb; 
        --brand-primary-hover: #1d4ed8;
        --brand-dark: #1e1e38;
        --bg-gradient: linear-gradient(135deg, #02447e 0%, #01284c 100%);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-gradient);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Card estilo Glassmorphic moderno */
      .card-clean {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      .form-label {
        color: rgba(255, 255, 255, 0.9);
        font-weight: 500;
        font-size: 0.875rem;
        margin-bottom: 6px;
      }

      .form-control {
        background-color: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
        border-radius: 10px;
        padding: 12px 16px;
        transition: all 0.2s ease-in-out;
      }

      .form-control::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .form-control:focus {
        background-color: rgba(255, 255, 255, 0.12);
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        color: #fff;
      }

      .btn-primary-custom {
        background-color: var(--brand-primary);
        border: none;
        color: #fff;
        font-weight: 600;
        padding: 14px 24px;
        border-radius: 10px;
        transition: all 0.2s ease;
      }

      .btn-primary-custom:hover {
        background-color: var(--brand-primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      }

      .section-divider {
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 8px;
        margin-top: 12px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>

    <main class="container py-4 flex-grow-1 d-flex flex-column justify-content-center align-items-center">
      <!-- Logo Centralizada -->
      <div class="text-center mb-4">
        <img
          src="{% static 'logo-white.jpg' %}"
          alt="HenriMar System"
          class="img-fluid"
          style="max-height: 120px;"
        />
      </div>

      <!-- Card do Formulário -->
      <div class="col-12 col-md-10 col-lg-7">
        <div class="card-clean p-4 p-md-5">
          <div class="mb-4 text-center text-md-start">
            <h2 class="fw-bold text-white mb-1">Cadastro de Rotas</h2>
            <p class="text-white-50 small mb-0">Insira os detalhes do percurso e do motorista</p>
          </div>

          <form action="{% url 'listagem_rotas' %}" method="POST">
            {% csrf_token %}

            <div class="row g-3">
              <!-- Rota -->
              <div class="col-12">
                <label class="form-label"><i class="bi bi-geo-alt me-1"></i> Rota</label>
                <input name="rota" type="text" class="form-control" placeholder="Ex: Rota 01 - Centro x Galpão" required />
              </div>

              <!-- Motorista -->
              <div class="col-12">
                <label class="form-label"><i class="bi bi-person me-1"></i> Motorista</label>
                <input name="motorista" type="text" class="form-control" placeholder="Nome do motorista" required />
              </div>

              <!-- Paradas e KM -->
              <div class="col-md-8">
                <label class="form-label"><i class="bi bi-signpost-split me-1"></i> Paradas</label>
                <input name="paradas" type="text" class="form-control" placeholder="Ex: Ponto A, Ponto B" />
              </div>

              <div class="col-md-4">
                <label class="form-label"><i class="bi bi-speedometer2 me-1"></i> KM Total</label>
                <input name="km" type="number" step="0.1" class="form-control" placeholder="0.0" />
              </div>

              <!-- Horários -->
              <div class="col-12">
                <div class="section-divider">
                  <i class="bi bi-clock me-1"></i> Horários
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label">Horário de Saída</label>
                <input name="horario_saida" type="time" class="form-control" />
              </div>

              <div class="col-md-6">
                <label class="form-label">Horário de Retorno</label>
                <input name="horario_retorno" type="time" class="form-control" />
              </div>

              <!-- Submissão -->
              <div class="col-12 mt-4">
                <button class="btn btn-primary-custom w-100" type="submit">
                  <i class="bi bi-check-circle me-2"></i> Confirmar Cadastro
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </main>

    <!-- Rodapé -->
    <footer class="py-3 text-center">
      <p class="text-white-50 mb-0" style="font-size: 0.8rem">
        &copy; {% now "Y" %} HenriMar System. Todos os direitos reservados.
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
